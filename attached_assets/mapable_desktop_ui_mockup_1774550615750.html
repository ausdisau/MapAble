
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapAble UI Mockup</title>
  <style>
    :root {
      --primary-color: #0052cc;
      --secondary-color: #f5f5f5;
      --accent-color: #ffd600;
      --text-color: #1a1a1a;
      --bg-color: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: var(--secondary-color);
      padding: 1rem;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .nav-link {
      margin: 0.5rem 0;
      cursor: pointer;
    }

    /* Main Content */
    .main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background-color: var(--primary-color);
      color: white;
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-bar {
      flex-grow: 1;
      margin: 0 1rem;
    }

    .tiles {
      display: flex;
      gap: 1rem;
      padding: 1rem;
    }

    .tile {
      background-color: var(--accent-color);
      flex: 1;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: 1rem;
    }

    .card {
      background-color: var(--secondary-color);
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 5px;
    }

    .card .tags {
      margin: 0.5rem 0;
      font-size: 0.85rem;
      color: #333;
    }

    .card button {
      background-color: var(--primary-color);
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    @media screen and (max-width: 1024px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media screen and (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .tiles {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>MapAble</h2>
    <div class="nav-link">Dashboard</div>
    <div class="nav-link">Book a Carer</div>
    <div class="nav-link">Find a Job</div>
    <div class="nav-link">Get Transport</div>
    <div class="nav-link">Community</div>
    <div class="nav-link">Marketplace</div>
    <div class="nav-link">Settings</div>
  </div>
  <div class="main">
    <div class="topbar">
      <span>Logo</span>
      <input class="search-bar" type="text" placeholder="Search services...">
      <span>Accessibility | Login</span>
    </div>
    <div class="tiles">
      <div class="tile">Book a Carer</div>
      <div class="tile">Find a Job</div>
      <div class="tile">Get Transport</div>
    </div>
    <div class="cards">
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Worker">
        <div>Support Worker A</div>
        <div class="tags">Manual handling, Auslan</div>
        <button>View Profile</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Worker">
        <div>Support Worker B</div>
        <div class="tags">Cultural Safety, Community Access</div>
        <button>Book</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Worker">
        <div>Support Worker C</div>
        <div class="tags">Transport, Meal Prep</div>
        <button>View Profile</button>
      </div>
    </div>
  </div>
</body>
</html>
