name: CareOS Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      skip_smoke:
        description: Skip smoke tests (emergency only)
        required: false
        type: boolean
        default: false

jobs:
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma validate
      - run: bash scripts/release/check-migrations.sh

  security-gate:
    runs-on: ubuntu-latest
    needs: migration-check
    steps:
      - uses: actions/checkout@v4
      - name: Security scan stub
        run: |
          echo "Security gate stub — integrate with semgrep.yml for full scan"
          echo "See .github/workflows/semgrep.yml"

  accessibility-gate:
    runs-on: ubuntu-latest
    needs: migration-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Accessibility gate stub
        run: |
          echo "Accessibility gate stub"
          pnpm test tests/accessibility/ 2>/dev/null || echo "No accessibility tests matched — stub pass"

  staging-deploy:
    runs-on: ubuntu-latest
    needs: [security-gate, accessibility-gate]
    if: github.event.inputs.environment == 'staging' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Staging deploy stub
        run: |
          echo "Staging deploy stub — no live deploy in CI"
          echo "Run: tofu plan -var-file=infra/environments/staging.tfvars"

  smoke-tests:
    runs-on: ubuntu-latest
    needs: staging-deploy
    if: github.event.inputs.skip_smoke != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests stub
        run: bash scripts/release/smoke-tests.sh

  production-approval:
    runs-on: ubuntu-latest
    needs: [migration-check, security-gate, accessibility-gate]
    if: github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Manual production approval required
        run: |
          echo "Production deployment approved by required reviewers"
          echo "Human approval gate — see docs/release/README.md"

  production-deploy:
    runs-on: ubuntu-latest
    needs: production-approval
    if: github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Production deploy stub
        run: |
          echo "Production deploy stub — execute via approved runbook"
          echo "Never auto-enable MAPABLE_NATIONAL_PLATFORM_ENABLED"

  post-deploy-health:
    runs-on: ubuntu-latest
    needs: [smoke-tests, production-deploy]
    if: always() && (needs.smoke-tests.result == 'success' || needs.production-deploy.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - name: Post-deploy health check
        run: bash scripts/release/post-deploy-health.sh

  rollback-guidance:
    runs-on: ubuntu-latest
    needs: post-deploy-health
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - name: Rollback guidance
        run: bash scripts/release/rollback.sh
