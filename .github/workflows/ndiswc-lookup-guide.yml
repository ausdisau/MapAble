name: Worker screening official pathway guide validation
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/lib/workers/ndiswc-*.ts"
      - "apps/web/components/workers/NdiswcLookupGuide.tsx"
      - "apps/web/app/worker-screening/lookup/**"
      - "apps/web/tests/ndiswc-*.test.ts"
      - "apps/web/tests/ndiswc-*.test.tsx"
      - "docs/worker-screening-jurisdiction-lookup.md"
      - ".github/workflows/ndiswc-lookup-guide.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ndiswc-guide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test official paths and accessible controls
        run: pnpm vitest run tests/ndiswc-lookup-guide.test.ts tests/ndiswc-jurisdictions.test.ts tests/ndiswc-lookup-guide-ui.test.tsx tests/ndiswc-jurisdiction-ui.test.tsx
      - name: Typecheck web
        run: pnpm type-check
      - name: Lint new worker-screening guide
        run: pnpm eslint lib/workers/ndiswc-lookup-guide.ts lib/workers/ndiswc-jurisdictions.ts components/workers/NdiswcLookupGuide.tsx app/worker-screening/lookup/page.tsx tests/ndiswc-lookup-guide.test.ts tests/ndiswc-jurisdictions.test.ts tests/ndiswc-lookup-guide-ui.test.tsx tests/ndiswc-jurisdiction-ui.test.tsx --max-warnings 0
