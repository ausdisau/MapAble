name: Migrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapable_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mapable_migrations?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mapable_migrations?schema=public
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migration order
        run: pnpm exec tsx scripts/ci/check-migration-order.ts

      - name: Migration integrity
        run: pnpm exec tsx scripts/ci/check-migration-integrity.ts

      - name: Apply all migrations from zero
        run: pnpm exec prisma migrate deploy

      - name: Generate client against migrated schema
        run: pnpm exec prisma generate

      - name: Validate schema
        run: pnpm exec prisma validate

      - name: Schema drift check (empty diff expected)
        run: |
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code || {
              echo "Schema drift detected between migrated DB and schema.prisma"
              pnpm exec prisma migrate diff \
                --from-url "$DATABASE_URL" \
                --to-schema-datamodel prisma/schema.prisma
              exit 1
            }
