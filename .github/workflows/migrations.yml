name: Migrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapable_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mapable_migrations?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mapable_migrations?schema=public
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migration order
        run: pnpm exec tsx scripts/ci/check-migration-order.ts

      - name: Migration integrity
        run: pnpm exec tsx scripts/ci/check-migration-integrity.ts

      # Many historical phase migrations are documentation stubs that historically
      # assumed `db push`. Until a baseline/squash PR lands, CI proves schema
      # coherence on an ephemeral DB (not a production instruction).
      - name: Ephemeral schema coherence (CI-only db push)
        run: |
          pnpm exec prisma db push --accept-data-loss --skip-generate
          pnpm exec prisma generate
          pnpm exec prisma validate

      - name: Schema matches Prisma models
        run: |
          if ! pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code; then
            echo "Schema drift between ephemeral DB and schema.prisma"
            pnpm exec prisma migrate diff \
              --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma
            exit 1
          fi

  migrate-from-zero-report:
    name: Migrate from zero (report)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapable_from_zero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mapable_from_zero?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mapable_from_zero?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Attempt migrate deploy from zero
        id: migrate
        run: |
          set +e
          pnpm exec prisma migrate deploy 2>&1 | tee /tmp/migrate-from-zero.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::migrate deploy from zero failed — see stub inventory in docs/remediation/MIGRATION_INVENTORY.md"
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrate-from-zero-log
          path: /tmp/migrate-from-zero.log
