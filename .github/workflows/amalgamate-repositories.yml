name: Verify MapAble unified repository

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "docs/repository-amalgamation.md"
      - "package.json"
      - ".replit"
      - "README.md"
      - ".github/workflows/amalgamate-repositories.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapable-unified-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out unified repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical monorepo layout
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f apps/web/package.json
          test -f apps/web/pnpm-workspace.yaml
          test -f apps/mobile/package.json
          test -f apps/mobile/App.tsx
          test -f docs/repository-amalgamation.md

          # The mobile application must live under apps/mobile, not at repo root.
          test ! -f App.tsx
          test ! -f app.json

          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('apps/web/package.json','utf8')); JSON.parse(require('fs').readFileSync('apps/mobile/package.json','utf8'))"

      - name: Verify imported web provenance is retained
        shell: bash
        run: |
          set -euo pipefail
          imported_commit="e0a8b6907b25b23eda82fcbc3b722c088861b704"
          git cat-file -e "${imported_commit}^{commit}"
          git log --all --format='%B' | grep -Fq "git-subtree-split: ${imported_commit}"

      - name: Report unified application roots
        shell: bash
        run: |
          echo "Canonical repository: ausdisau/MapAble"
          echo "Web application: apps/web"
          echo "Mobile application: apps/mobile"
