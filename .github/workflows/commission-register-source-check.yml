name: Commission CSV source inspection (read-only)
on:
  pull_request:
    paths:
      - ".github/workflows/commission-register-source-check.yml"
      - "apps/web/scripts/probe-commission-csv.py"
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout files for read-only source QA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download actual NDIS Commission registered-provider CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commission"
          curl --http1.1 --fail --show-error --silent --location \
            --retry-all-errors --user-agent "Mozilla/5.0 (compatible; MapAblePublicDataQA/1.0)" \
            --header "Accept: text/csv,application/octet-stream;q=0.9,*/*;q=0.5" \
            --retry 2 --connect-timeout 20 --max-time 120 \
            --max-filesize 67108864 \
            --output "$RUNNER_TEMP/commission/provider-register.csv" \
            "https://www.ndiscommission.gov.au/provider-registration/find-registered-provider/download-csv"
      - name: Validate source encoding, exact headers, row shape and SHA256
        shell: bash
        run: |
          python3 apps/web/scripts/probe-commission-csv.py \
            --file "$RUNNER_TEMP/commission/provider-register.csv" \
            --report "$RUNNER_TEMP/commission/schema-report.json" \
            --source-url "https://www.ndiscommission.gov.au/provider-registration/find-registered-provider/download-csv"
      - name: Save metadata only - never export raw register to Actions artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commission-csv-schema-metadata
          path: ${{ runner.temp }}/commission/schema-report.json
          retention-days: 7
          if-no-files-found: error
