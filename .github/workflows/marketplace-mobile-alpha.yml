name: Mobile marketplace closed-alpha
on:
  pull_request:
    paths:
      - "apps/mobile/App.tsx"
      - "apps/mobile/env.d.ts"
      - "apps/mobile/src/components/MarketplaceAlphaScreen.tsx"
      - "apps/mobile/src/runtime/marketplaceAlpha.ts"
      - ".github/workflows/marketplace-mobile-alpha.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Validate mobile TypeScript
        working-directory: apps/mobile
        run: npm run typecheck
