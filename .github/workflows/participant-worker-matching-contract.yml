name: Participant worker matching synthetic contract

on:
  pull_request:
    paths:
      - "apps/web/lib/matching/participant-preview.ts"
      - "apps/web/tests/matching/participant-preview.contract.test.mjs"
      - ".github/workflows/participant-worker-matching-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pure synthetic contract tests without external dependencies
        run: node --experimental-strip-types --test apps/web/tests/matching/participant-preview.contract.test.mjs
