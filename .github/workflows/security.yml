name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "59 0 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep CI
        run: semgrep ci

  security-gates:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: |
          set +e
          pnpm audit --audit-level=high
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "WARN: pnpm audit reported high+ issues (code $code). Failing on critical prod deps only."
            pnpm audit --prod --audit-level=critical
          fi

      - name: Secret pattern scanning
        run: pnpm exec tsx scripts/ci/check-secret-patterns.ts

      - name: Unsafe environment fallbacks
        run: pnpm exec tsx scripts/ci/check-unsafe-env-fallbacks.ts

      - name: Route authentication smoke
        run: pnpm exec tsx scripts/ci/check-route-auth-smoke.ts

      - name: File upload validation
        run: pnpm exec tsx scripts/ci/check-file-upload-validation.ts

      - name: Public API data-exposure
        run: pnpm exec tsx scripts/ci/check-public-api-exposure.ts
