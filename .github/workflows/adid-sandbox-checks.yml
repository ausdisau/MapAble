name: AD.iD sandbox checks
on:
  pull_request:
    paths:
      - "apps/adid/**"
      - ".github/workflows/adid-sandbox-checks.yml"
  push:
    branches:
      - feat/adid-clerk-wix-neon-sandbox-20261110
    paths:
      - "apps/adid/**"
      - ".github/workflows/adid-sandbox-checks.yml"
permissions:
  contents: read
jobs:
  check-adid:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/adid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript type check
        run: npm run typecheck
      - name: Pure public contract tests
        run: npm test
      # Browser/Clerk integration tests require a protected preview tenant and are explicitly not run here.
