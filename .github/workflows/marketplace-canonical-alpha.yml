name: Canonical Marketplace closed-alpha checks

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/marketplace/alpha/**"
      - "apps/web/app/api/marketplace/alpha-estimate/**"
      - "apps/web/app/api/billing/invoices/route.ts"
      - "apps/web/app/marketplace/(shop)/cart/page.tsx"
      - "apps/web/components/marketplace/**"
      - "apps/web/lib/marketplace/alpha-access.ts"
      - "apps/web/packages/marketplace-inclusive/**"
      - "apps/web/tests/marketplace-*.test.ts"
      - "apps/web/tests/marketplace-*.test.tsx"
      - "apps/mobile/src/marketplace/**"
      - "docs/marketplace-closed-alpha-canonical.md"
      - ".github/workflows/marketplace-canonical-alpha.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-alpha-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/marketplace-closed-alpha.test.ts tests/marketplace-inclusive.test.ts tests/marketplace-inclusive.ui.test.tsx tests/marketplace-operations-cycle.test.ts tests/marketplace-operations-ui.test.tsx tests/marketplace-alpha-access.test.ts
      - name: Type-check web (including after test failures)
        if: success() || failure()
        run: pnpm type-check
      - name: Scoped ESLint (including after test failures)
        if: success() || failure()
        env:
          ESLINT_CI_LIGHT: "1"
        run: pnpm exec eslint "app/marketplace/alpha/**/*.tsx" app/api/marketplace/alpha-estimate/route.ts app/api/billing/invoices/route.ts components/marketplace/InclusiveMarketplace.tsx components/marketplace/MarketplaceOperationsLab.tsx components/marketplace/MarketplaceClosedAlpha.tsx lib/marketplace/alpha-access.ts packages/marketplace-inclusive/src tests/marketplace-alpha-access.test.ts --max-warnings 0

  mobile-alpha-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
