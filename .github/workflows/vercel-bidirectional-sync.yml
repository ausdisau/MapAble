name: Vercel ↔ GitHub synchronization

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.canceled
      - vercel.deployment.ignored
      - vercel.deployment.skipped
      - vercel.deployment.pending
      - vercel.deployment.failed
      - vercel.deployment.promoted
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vercel-github-sync-${{ github.event.client_payload.sha || github.event.client_payload.git.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  mirror-vercel-status:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment metadata
        id: deployment
        env:
          EVENT_TYPE: ${{ github.event.action }}
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        shell: bash
        run: |
          set -euo pipefail

          sha="$(jq -r '.sha // .git.sha // .gitSha // .commitSha // .meta.githubCommitSha // empty' <<<"${PAYLOAD_JSON}")"
          url="$(jq -r '.url // .deployment.url // .deploymentUrl // empty' <<<"${PAYLOAD_JSON}")"

          if [[ -z "${sha}" ]]; then
            echo "No commit SHA was supplied by the Vercel repository_dispatch payload."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          case "${EVENT_TYPE}" in
            vercel.deployment.ready|vercel.deployment.success|vercel.deployment.promoted)
              state="success"
              description="Vercel deployment succeeded"
              ;;
            vercel.deployment.error|vercel.deployment.failed)
              state="failure"
              description="Vercel deployment failed"
              ;;
            vercel.deployment.canceled|vercel.deployment.ignored|vercel.deployment.skipped)
              state="error"
              description="Vercel deployment did not complete"
              ;;
            vercel.deployment.pending)
              state="pending"
              description="Vercel deployment is pending"
              ;;
            *)
              state="pending"
              description="Vercel deployment status updated"
              ;;
          esac

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          echo "description=${description}" >> "${GITHUB_OUTPUT}"

      - name: Publish Vercel status on source commit
        if: steps.deployment.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.deployment.outputs.sha }}
          STATE: ${{ steps.deployment.outputs.state }}
          DESCRIPTION: ${{ steps.deployment.outputs.description }}
          TARGET_URL: ${{ steps.deployment.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          body="$(jq -n \
            --arg state "${STATE}" \
            --arg description "${DESCRIPTION}" \
            --arg context "Vercel / deployment" \
            --arg target_url "${TARGET_URL}" \
            '{state:$state, description:$description, context:$context} + (if $target_url == "" then {} else {target_url:$target_url} end)')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d "${body}"

      - name: Write synchronization summary
        if: always()
        env:
          EVENT_TYPE: ${{ github.event.action }}
          SHA: ${{ steps.deployment.outputs.sha }}
          STATE: ${{ steps.deployment.outputs.state }}
          TARGET_URL: ${{ steps.deployment.outputs.url }}
          SKIP: ${{ steps.deployment.outputs.skip }}
        shell: bash
        run: |
          {
            echo "## Vercel → GitHub synchronization"
            echo
            echo "- Event: \`${EVENT_TYPE}\`"
            if [[ "${SKIP}" == "true" ]]; then
              echo "- Result: payload did not expose a source commit SHA, so no commit status was written."
            else
              echo "- Commit: \`${SHA}\`"
              echo "- GitHub status: \`${STATE}\`"
              if [[ -n "${TARGET_URL}" ]]; then
                echo "- Deployment: https://${TARGET_URL#https://}"
              fi
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  manual-contract-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Report expected Git integration contract
        shell: bash
        run: |
          {
            echo "## GitHub → Vercel synchronization"
            echo
            echo "This repository expects the Vercel project to use Vercel's native GitHub integration with:"
            echo
            echo "- repository: \`ausdisau/MapAble\`"
            echo "- production branch: \`main\`"
            echo "- web root directory: \`apps/web\`"
            echo
            echo "Vercel deployment events should be delivered back to this repository as \`repository_dispatch\` events, which this workflow mirrors onto the originating commit."
          } >> "${GITHUB_STEP_SUMMARY}"
