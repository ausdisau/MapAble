name: MapAble ATPU cost telemetry contract

on:
  pull_request:
    paths:
      - "apps/web/lib/ai/platform/telemetry/atpu-cost.ts"
      - "apps/web/lib/ai/platform/telemetry/data/mapable-ai-token-rate-register.json"
      - "apps/web/tests/ai-platform/atpu-cost.contract.test.mjs"
      - ".github/workflows/atpu-cost-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run ATPU cost and provenance tests
        run: node --experimental-strip-types --test apps/web/tests/ai-platform/atpu-cost.contract.test.mjs
