name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapable_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NODE_OPTIONS: --max-old-space-size=6144
      # Build-time placeholders (fail-closed runtime validation is PR 2)
      NEXTAUTH_SECRET: ci-nextauth-secret-not-for-production-use-32chars
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mapable_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mapable_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm exec prisma validate

      # Full `prisma format` rewrite of schema.prisma is deferred (large unrelated
      # churn). Validate + generate remain required.

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Type-check
        run: pnpm type-check

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Test DB schema: historical migration stubs block migrate-from-zero.
      # Ephemeral CI uses db push (not a production runbook instruction).
      - name: Apply schema for tests (ephemeral)
        run: pnpm exec prisma db push --accept-data-loss --skip-generate

      - name: Unit / integration tests
        run: pnpm test

      - name: Migration collision + order
        run: |
          pnpm exec tsx scripts/ci/check-migration-order.ts
          pnpm exec tsx scripts/ci/check-migration-integrity.ts

      - name: Domain ownership
        run: pnpm exec tsx scripts/ci/check-domain-ownership.ts

      - name: Feature dependencies
        run: pnpm exec tsx scripts/ci/check-feature-dependencies.ts

      - name: Merge-train / PR ledger integrity
        run: pnpm exec tsx scripts/ci/check-merge-train-integrity.ts

      - name: Readiness evidence consistency
        run: pnpm exec tsx scripts/ci/check-readiness-evidence-consistency.ts

      - name: Controlled-pilot baseline
        run: pnpm exec tsx scripts/ci/check-controlled-pilot-baseline.ts

      - name: Production build
        run: pnpm build

      - name: API contract tests
        run: pnpm exec vitest run tests/security tests/billing-policy.test.ts
